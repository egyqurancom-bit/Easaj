<!DOCTYPE html>
<html class="light" lang="ar" dir="rtl">
<head>
    <!-- كود الوضع الليلي المبكر لمنع وميض الشاشة الأبيض -->
    <script>
        (function () {
            try {
                if (localStorage.getItem('wartel_theme') === 'dark') {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        })();
    </script>
    
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title id="page-title">ورتّـل - تطبيق استماع للقرآن</title>
    
    <!-- تسريع الاتصال بسيرفرات جوجل للخطوط -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- خطوط جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet"/>
    
    <!-- ربط ملف التنسيقات الخارجي -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-watermark font-body-lg md:hidden relative pb-24 transition-colors duration-300">

    <!-- Language Modal -->
    <div id="lang-modal" class="hidden fixed inset-0 z-[200] bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-surface-container-lowest dark:bg-slate-800 w-full max-w-sm rounded-xl p-6 shadow-xl">
            <h3 class="font-headline-md text-2xl mb-6 text-primary dark:text-emerald-400" data-i18n="select_lang">اختر اللغة</h3>
            <div class="space-y-3">
                <button onclick="setLanguage('ar')" class="w-full text-right px-4 py-3 rounded-lg border border-outline-variant dark:border-slate-600 hover:bg-surface-container dark:hover:bg-slate-700 transition-colors font-display-quran text-xl flex justify-between items-center flex-row-reverse dark:text-white">
                    العربية <span class="text-xs bg-surface-variant dark:bg-slate-600 px-2 py-1 rounded">AR</span>
                </button>
                <button onclick="setLanguage('en')" class="w-full text-left px-4 py-3 rounded-lg border border-outline-variant dark:border-slate-600 hover:bg-surface-container dark:hover:bg-slate-700 transition-colors flex justify-between items-center dark:text-white dir-ltr text-left">
                    English <span class="text-xs bg-surface-variant dark:bg-slate-600 px-2 py-1 rounded">EN</span>
                </button>
            </div>
            <div class="mt-6 flex justify-end">
                <button class="px-4 py-2 text-primary dark:text-emerald-400 font-bold uppercase hover:bg-primary/10 rounded-lg" onclick="toggleLangModal(false)" data-i18n="cancel">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- ==================== PLAYER TOOLS MENU ==================== -->
    <div id="player-menu-modal" class="hidden fixed inset-0 z-[200] bg-black/50 backdrop-blur-sm flex items-end justify-center p-4" onclick="if(event.target===this) togglePlayerMenu(false)">
        <div class="bg-surface-container-lowest dark:bg-slate-800 w-full max-w-sm rounded-2xl p-4 shadow-xl mb-20 space-y-2">
            <button onclick="toggleSleepModal(true)" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-surface-container dark:hover:bg-slate-700 text-on-surface dark:text-white text-start">
                <span class="material-symbols-outlined text-primary dark:text-emerald-400">bedtime</span>
                <span class="font-bold">مؤقت النوم</span>
            </button>
            <button onclick="toggleHifzModal(true)" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-surface-container dark:hover:bg-slate-700 text-on-surface dark:text-white text-start">
                <span class="material-symbols-outlined text-primary dark:text-emerald-400">repeat_on</span>
                <span class="font-bold">وضع الحفظ (تكرار مقطع)</span>
            </button>
            <button onclick="togglePlayerMenu(false)" class="w-full text-center px-4 py-2 text-on-surface-variant dark:text-slate-400 font-bold">إلغاء</button>
        </div>
    </div>

    <!-- ==================== SLEEP TIMER MODAL ==================== -->
    <div id="sleep-timer-modal" class="hidden fixed inset-0 z-[200] bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-surface-container-lowest dark:bg-slate-800 w-full max-w-sm rounded-xl p-6 shadow-xl">
            <h3 class="font-headline-md text-2xl mb-2 text-primary dark:text-emerald-400">مؤقت النوم</h3>
            <p class="text-sm text-on-surface-variant dark:text-slate-400 mb-4">أوقف التشغيل تلقائياً بعد:</p>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="setSleepTimer(15)" class="px-4 py-3 rounded-lg border border-outline-variant dark:border-slate-600 hover:bg-surface-container dark:hover:bg-slate-700 dark:text-white font-bold">15 دقيقة</button>
                <button onclick="setSleepTimer(30)" class="px-4 py-3 rounded-lg border border-outline-variant dark:border-slate-600 hover:bg-surface-container dark:hover:bg-slate-700 dark:text-white font-bold">30 دقيقة</button>
                <button onclick="setSleepTimer(45)" class="px-4 py-3 rounded-lg border border-outline-variant dark:border-slate-600 hover:bg-surface-container dark:hover:bg-slate-700 dark:text-white font-bold">45 دقيقة</button>
                <button onclick="setSleepTimer(60)" class="px-4 py-3 rounded-lg border border-outline-variant dark:border-slate-600 hover:bg-surface-container dark:hover:bg-slate-700 dark:text-white font-bold">60 دقيقة</button>
            </div>
            <button onclick="setSleepTimer('end')" class="w-full mt-2 px-4 py-3 rounded-lg border border-outline-variant dark:border-slate-600 hover:bg-surface-container dark:hover:bg-slate-700 dark:text-white font-bold">بعد نهاية السورة الحالية</button>
            <div class="mt-6 flex justify-between">
                <button class="px-4 py-2 text-red-500 font-bold hover:bg-red-500/10 rounded-lg" onclick="setSleepTimer('off')">إلغاء المؤقت</button>
                <button class="px-4 py-2 text-primary dark:text-emerald-400 font-bold hover:bg-primary/10 rounded-lg" onclick="toggleSleepModal(false)">إغلاق</button>
            </div>
        </div>
    </div>

    <!-- ==================== HIFZ MODE MODAL ==================== -->
    <div id="hifz-modal" class="hidden fixed inset-0 z-[200] bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-surface-container-lowest dark:bg-slate-800 w-full max-w-sm rounded-xl p-6 shadow-xl">
            <h3 class="font-headline-md text-2xl mb-2 text-primary dark:text-emerald-400">وضع الحفظ</h3>
            <p class="text-sm text-on-surface-variant dark:text-slate-400 mb-4">حدد بداية ونهاية المقطع أثناء الاستماع، ثم اختر عدد مرات التكرار.</p>
            <div class="space-y-3">
                <div class="flex items-center gap-2">
                    <button onclick="setHifzStart()" class="shrink-0 px-3 py-2 rounded-lg bg-primary dark:bg-emerald-400 text-white dark:text-slate-900 text-xs font-bold">تعيين البداية الآن</button>
                    <input id="hifz-start-input" readonly class="flex-1 text-center py-2 rounded-lg border border-outline-variant dark:border-slate-600 dark:bg-slate-700 dark:text-white text-sm" value="0:00"/>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="setHifzEnd()" class="shrink-0 px-3 py-2 rounded-lg bg-primary dark:bg-emerald-400 text-white dark:text-slate-900 text-xs font-bold">تعيين النهاية الآن</button>
                    <input id="hifz-end-input" readonly class="flex-1 text-center py-2 rounded-lg border border-outline-variant dark:border-slate-600 dark:bg-slate-700 dark:text-white text-sm" value="0:00"/>
                </div>
                <div class="flex items-center gap-2">
                    <label class="text-sm text-on-surface dark:text-white shrink-0">عدد التكرارات</label>
                    <input id="hifz-reps-input" type="number" min="1" max="50" value="5" class="flex-1 text-center py-2 rounded-lg border border-outline-variant dark:border-slate-600 dark:bg-slate-700 dark:text-white text-sm"/>
                </div>
            </div>
            <div class="mt-6 flex justify-between items-center">
                <button class="px-4 py-2 text-red-500 font-bold hover:bg-red-500/10 rounded-lg" onclick="stopHifzMode(); toggleHifzModal(false)">إيقاف الوضع</button>
                <div class="flex gap-2">
                    <button class="px-4 py-2 text-on-surface-variant dark:text-slate-400 font-bold" onclick="toggleHifzModal(false)">إلغاء</button>
                    <button class="px-4 py-2 bg-primary dark:bg-emerald-400 text-white dark:text-slate-900 font-bold rounded-lg" onclick="startHifzMode()">ابدأ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== HOME SCREEN (RECITERS) ==================== -->
    <div id="screen-home" class="block min-h-screen">
        <header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-[#0f1115]/80 backdrop-blur-xl transition-colors duration-300 flex items-center justify-between px-6 h-16 max-w-[720px] mx-auto">
            <button class="text-primary dark:text-emerald-400 opacity-0 pointer-events-none"><span class="material-symbols-outlined">menu</span></button>
            <h1 class="font-page-title text-3xl font-bold text-primary dark:text-emerald-400 text-center w-full" data-i18n="app_title">ورتّـل</h1>
            <button onclick="toggleLangModal(true)" class="text-primary dark:text-emerald-400 hover:bg-primary/10 p-2 rounded-full"><span class="material-symbols-outlined">language</span></button>
        </header>

        <main class="pt-[88px] px-6 pb-10 max-w-[720px] mx-auto space-y-10">
            
            <!-- Featured Reciter -->
            <section id="featured-reciter-section" class="hidden">
                <h2 id="featured-section-title" class="font-headline-md text-xl font-bold text-on-surface dark:text-white mb-4" data-i18n="featured_reciter">القارئ المتميز</h2>
                <div class="bg-surface-container-lowest dark:bg-slate-800 rounded-xl overflow-hidden shadow-sm border border-surface-container dark:border-slate-700 relative" id="featured-card">
                    <div id="featured-carousel-track" dir="ltr" class="flex transition-transform duration-700 ease-in-out">
                        <!-- سيتم حقن إطارات القارئ المتميز هنا -->
                    </div>
                    <div id="featured-carousel-dots" class="absolute bottom-2 inset-x-0 flex justify-center gap-1.5 z-10"></div>
                </div>
            </section>

            <!-- Eminent Voices -->
            <section>
                <div class="flex justify-between items-end mb-4">
                    <h2 class="font-headline-md text-xl font-bold text-on-surface dark:text-white" data-i18n="eminent_voices">أصوات بارزة</h2>
                    <a class="font-label-sm text-sm text-primary dark:text-emerald-400 hover:underline cursor-pointer" data-i18n="see_all">عرض الكل</a>
                </div>
                <div id="reciters-container" class="space-y-4">
                    <p class="text-center text-gray-500 py-10" data-i18n="loading">جاري تحميل البيانات...</p>
                </div>
            </section>
        </main>
    </div>

    <!-- ==================== FAVORITES SCREEN ==================== -->
    <div id="screen-favorites" class="screen-hidden block min-h-screen">
        <header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-[#0f1115]/80 backdrop-blur-xl flex items-center justify-center px-6 h-16 max-w-[720px] mx-auto">
            <h1 class="font-page-title text-2xl font-bold text-primary dark:text-emerald-400" data-i18n="nav_fav">المـفـضـلة</h1>
        </header>
        <main id="favorites-container" class="pt-[100px] px-6 max-w-[720px] mx-auto flex flex-col pb-24 items-center text-center">
        </main>
    </div>

    <!-- ==================== SETTINGS SCREEN ==================== -->
    <div id="screen-settings" class="screen-hidden block min-h-screen">
        <header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-[#0f1115]/80 backdrop-blur-xl flex items-center justify-center px-6 h-16 max-w-[720px] mx-auto">
            <h1 class="font-page-title text-2xl font-bold text-primary dark:text-emerald-400" data-i18n="nav_settings">الإعــدادات</h1>
        </header>
        <main class="pt-[100px] px-6 max-w-[720px] mx-auto space-y-4">
            <button onclick="toggleLangModal(true)" class="w-full flex items-center justify-between p-4 bg-surface-container-lowest dark:bg-slate-800 rounded-xl shadow-sm border border-surface-container dark:border-slate-700 hover:bg-surface-container dark:hover:bg-slate-700 transition-colors">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-primary/10 dark:bg-emerald-400/20 flex items-center justify-center text-primary dark:text-emerald-400"><span class="material-symbols-outlined">language</span></div>
                    <span class="font-body-lg text-on-surface dark:text-white" data-i18n="select_lang">تغيير اللغة</span>
                </div>
                <span class="material-symbols-outlined text-on-surface-variant dark:text-slate-400 rtl:rotate-180">chevron_right</span>
            </button>
            <button onclick="toggleDarkMode()" class="w-full flex items-center justify-between p-4 bg-surface-container-lowest dark:bg-slate-800 rounded-xl shadow-sm border border-surface-container dark:border-slate-700 hover:bg-surface-container dark:hover:bg-slate-700 transition-colors">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-primary/10 dark:bg-emerald-400/20 flex items-center justify-center text-primary dark:text-emerald-400"><span class="material-symbols-outlined">dark_mode</span></div>
                    <span class="font-body-lg text-on-surface dark:text-white" data-i18n="dark_mode">الوضع الليلي</span>
                </div>
                <div id="dark-toggle" class="w-12 h-6 bg-surface-variant dark:bg-emerald-500 rounded-full p-1 flex items-center transition-colors relative">
                    <div id="dark-toggle-thumb" class="w-4 h-4 bg-outline dark:bg-white rounded-full shadow-sm transition-transform duration-300 absolute translate-x-0 dark:rtl:-translate-x-6 dark:ltr:translate-x-6"></div>
                </div>
            </button>
        </main>
    </div>

    <!-- ==================== PROFILE (SURAHS) SCREEN ==================== -->
    <div id="screen-profile" class="screen-hidden arabesque-pattern min-h-screen pb-[140px] md:hidden">
        <header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-[#0f1115]/80 backdrop-blur-xl">
            <div class="flex items-center justify-between px-6 h-16 w-full max-w-[720px] mx-auto">
                <button class="nav-home text-on-surface-variant dark:text-emerald-400 hover:bg-primary/10 p-2 rounded-full"><span class="material-symbols-outlined rtl:rotate-180">arrow_back</span></button>
                <h1 class="font-page-title text-2xl font-bold text-primary dark:text-emerald-400" data-i18n="app_title">ورتّـل</h1>
                <button class="text-on-surface-variant dark:text-emerald-400 opacity-0 pointer-events-none p-2"><span class="material-symbols-outlined">more_vert</span></button>
            </div>
        </header>

        <main class="pt-20 px-6 max-w-[720px] mx-auto">
            <div class="flex flex-col items-center mb-8 pt-4" id="profile-header"></div>
            <div class="flex flex-col gap-4" id="surahs-container"></div>
        </main>
    </div>

    <!-- ==================== NOW PLAYING SCREEN ==================== -->
    <div id="screen-player" class="screen-hidden arabesque-pattern h-[100dvh] flex-col overflow-hidden bg-surface dark:bg-[#0f1115]">
        <header class="flex items-center justify-between px-6 h-16 w-full max-w-[720px] mx-auto pt-4 shrink-0 relative z-10">
            <button class="nav-home w-10 h-10 flex items-center justify-center text-on-surface-variant dark:text-slate-300 hover:bg-primary/10 rounded-full"><span class="material-symbols-outlined rtl:rotate-180">keyboard_arrow_down</span></button>
            <div class="flex flex-col items-center">
                <h1 class="text-xs font-bold text-primary dark:text-emerald-400 uppercase tracking-wider" data-i18n="now_playing">قيد التشغيل</h1>
            </div>
            <button onclick="togglePlayerMenu(true)" class="w-10 h-10 flex items-center justify-center text-on-surface-variant dark:text-slate-300 hover:bg-primary/10 rounded-full"><span class="material-symbols-outlined">more_vert</span></button>
        </header>

        <main class="flex-1 w-full max-w-[720px] mx-auto flex flex-col justify-between px-6 pb-[110px] pt-2 relative z-10 min-h-0">
            <div class="flex flex-col items-center justify-center flex-1 min-h-0">
                <div class="relative w-[60vw] max-w-[280px] aspect-square mb-6 flex items-center justify-center">
                    <div class="absolute inset-0 rounded-full pulse-ring bg-primary-container/5 dark:border-emerald-400/20"></div>
                    <div class="absolute inset-4 rounded-full bg-primary-container/10 dark:border-emerald-400/30"></div>
                    <div class="relative w-[80%] h-[80%] rounded-full overflow-hidden shadow-lg border-[3px] border-surface-container-lowest dark:border-slate-800 z-10">
                        <img id="player-img" class="object-cover w-full h-full" src="" loading="lazy"/>
                    </div>
                </div>
                <div class="text-center space-y-1">
                    <h2 id="player-surah" class="font-display-quran text-3xl font-bold text-primary dark:text-white tracking-tight">السورة</h2>
                    <p id="player-reciter" class="text-lg text-on-surface-variant dark:text-slate-300">القارئ</p>
                    <div class="flex items-center justify-center gap-2 flex-wrap mt-1">
                        <div id="sleep-badge" class="hidden px-3 py-1 rounded-full bg-primary/10 dark:bg-emerald-400/20 text-primary dark:text-emerald-400 text-xs font-bold cursor-pointer" onclick="toggleSleepModal(true)"><span></span></div>
                        <div id="hifz-badge" class="hidden px-3 py-1 rounded-full bg-secondary-container/20 text-on-secondary-container dark:text-emerald-400 text-xs font-bold cursor-pointer" onclick="toggleHifzModal(true)"><span></span></div>
                    </div>
                </div>
            </div>

            <div class="w-full shrink-0 space-y-6 mt-4">
                <!-- عنصر تشغيل الصوت الخفي -->
                <audio id="audio-player" class="hidden" src=""></audio>
                
                <div class="space-y-2">
                    <div id="progress-container" class="w-full py-2 cursor-pointer touch-none relative custom-progress">
                        <div id="progress-track" class="w-full h-2 bg-surface-variant dark:bg-slate-700 rounded-full relative">
                            <div id="progress-bar" class="absolute top-0 ltr:left-0 rtl:right-0 h-full bg-secondary-container dark:bg-emerald-500 rounded-full w-[0%] pointer-events-none"></div>
                            <div id="progress-thumb" class="absolute top-1/2 w-4 h-4 -mt-2 -ms-2 bg-secondary-container dark:bg-emerald-500 rounded-full border-2 border-white dark:border-slate-900 shadow-md pointer-events-none z-10" style="inset-inline-start: 0%;"></div>
                        </div>
                    </div>
                    <div class="flex justify-between text-xs text-on-surface-variant dark:text-slate-400 mt-2">
                        <span id="current-time">0:00</span><span id="total-time">--:--</span>
                    </div>
                </div>
                
                <div class="flex items-center justify-between px-2">
                    <button id="autoplay-btn" onclick="toggleAutoplay()" title="تشغيل تلقائي للسورة التالية" class="w-12 h-12 flex items-center justify-center text-on-surface-variant dark:text-slate-300 hover:bg-surface-container dark:hover:bg-slate-800 rounded-full transition-colors"><span id="autoplay-icon" class="material-symbols-outlined">playlist_play</span></button>
                    <button onclick="playPrev()" class="w-14 h-14 flex items-center justify-center text-on-surface dark:text-white hover:bg-surface-container dark:hover:bg-slate-800 rounded-full"><span class="material-symbols-outlined text-[32px] rtl:rotate-180" style="font-variation-settings: 'FILL' 1;">skip_previous</span></button>
                    <button onclick="togglePlay()" class="relative w-20 h-20 flex items-center justify-center bg-primary dark:bg-emerald-400 text-white dark:text-slate-900 rounded-full shadow-md hover:bg-primary-container active:scale-95">
                        <span id="buffer-spinner" class="hidden absolute inset-0 rounded-full border-[3px] border-white/30 dark:border-slate-900/30 border-t-white dark:border-t-slate-900 animate-spin"></span>
                        <span id="play-pause-btn" class="material-symbols-outlined text-[40px] rtl:rotate-180" style="font-variation-settings: 'FILL' 1;">pause</span>
                    </button>
                    <button onclick="playNext()" class="w-14 h-14 flex items-center justify-center text-on-surface dark:text-white hover:bg-surface-container dark:hover:bg-slate-800 rounded-full"><span class="material-symbols-outlined text-[32px] rtl:rotate-180" style="font-variation-settings: 'FILL' 1;">skip_next</span></button>
                    <button id="repeat-btn" onclick="toggleRepeat()" title="تكرار السورة الحالية" class="w-12 h-12 flex items-center justify-center text-on-surface-variant dark:text-slate-300 hover:bg-surface-container dark:hover:bg-slate-800 rounded-full transition-colors"><span id="repeat-icon" class="material-symbols-outlined">repeat</span></button>
                </div>
            </div>
        </main>
    </div>

    <!-- ==================== MINI PLAYER ==================== -->
    <div id="mini-player" class="hidden fixed bottom-24 inset-x-4 max-w-[420px] mx-auto z-40 bg-surface-container-lowest/95 dark:bg-[#1a1d1d]/95 backdrop-blur-2xl shadow-[0_10px_35px_-6px_rgba(0,53,39,0.28)] dark:shadow-[0_10px_35px_-6px_rgba(0,0,0,0.55)] border border-outline-variant/40 dark:border-slate-700/60 rounded-2xl transition-colors duration-300">
        <div id="mini-progress-track" class="w-full h-1 bg-surface-variant dark:bg-slate-700 rounded-t-2xl overflow-hidden cursor-pointer">
            <div id="mini-progress-bar" class="h-full bg-primary dark:bg-emerald-400 w-[0%] pointer-events-none custom-mini-progress"></div>
        </div>
        <div class="flex items-center gap-3 px-3 py-2">
            <img id="mini-player-img" class="w-10 h-10 rounded-full object-cover shrink-0" src="" loading="lazy"/>
            <div class="flex-1 min-w-0 cursor-pointer" onclick="showScreen('screen-player')">
                <h4 id="mini-player-surah" class="text-sm font-bold text-on-surface dark:text-white truncate">-</h4>
                <p id="mini-player-reciter" class="text-xs text-on-surface-variant dark:text-slate-400 truncate">-</p>
            </div>
            <button onclick="event.stopPropagation(); togglePlay()" class="w-10 h-10 shrink-0 flex items-center justify-center bg-primary dark:bg-emerald-400 text-white dark:text-slate-900 rounded-full active:scale-95 transition">
                <span id="mini-play-pause-btn" class="material-symbols-outlined text-xl">pause</span>
            </button>
        </div>
    </div>

    <!-- ==================== BOTTOM NAVIGATION ==================== -->
